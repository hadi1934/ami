 if(w.length>1){if(S.found.includes(w))toast('این کلمه را قبلاً پیدا کردی');
  else if(cur.w.includes(w)){got(w,1)}else if(canMake(w)){S.extraAttempts=(S.extraAttempts||0)+1;if(S.extraAttempts>100){S.extraAttempts=1;S.extraUnknownAccepted=0}if(isKnownWord(w)){extra(w)}else if((S.extraUnknownAccepted||0)<3){S.extraUnknownAccepted=(S.extraUnknownAccepted||0)+1;extra(w)}else{save();toast('این کلمه در فهرست واژه‌های معتبر نیست');t.className='on bad'}}else{t.className='on bad'}}
