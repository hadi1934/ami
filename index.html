function modal(h,btn,fn){$('#box').innerHTML=h+'<br><button id="ok">'+btn+'</button>';$('#ov').classList.add('on');$('#ok').onclick=()=>{$('#ov').classList.remove('on');fn&&fn()}}
const SC=[{n:"🏛️ تخت جمشید",g:"#5ec3ff,#fff1b8",s:`<svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMax meet"><g fill="#e6c07d" stroke="#8a5f2b" stroke-width="2"><polygon points="0,220 0,196 36,196 36,184 72,184 72,172 108,172 108,220"/><rect x="130" y="74" width="20" height="124" rx="3"/><rect x="125" y="62" width="30" height="14" rx="3"/><rect x="126" y="196" width="28" height="12" rx="2"/><rect x="175" y="74" width="20" height="124" rx="3"/><rect x="170" y="62" width="30" height="14" rx="3"/><rect x="171" y="196" width="28" height="12" rx="2"/><rect x="220" y="74" width="20" height="124" rx="3"/><rect x="215" y="62" width="30" height="14" rx="3"/><rect x="216" y="196" width="28" height="12" rx="2"/><rect x="265" y="74" width="20" height="124" rx="3"/><rect x="260" y="62" width="30" height="14" rx="3"/><rect x="261" y="196" width="28" height="12" rx="2"/><rect x="310" y="74" width="20" height="124" rx="3"/><rect x="305" y="62" width="30" height="14" rx="3"/><rect x="306" y="196" width="28" height="12" rx="2"/><rect x="118" y="44" width="228" height="16" rx="3"/><rect x="108" y="206" width="260" height="14"/></g></svg>`},{n:"🗼 برج آزادی",g:"#7fb2ff,#ffd9a0",s:`<svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMax meet"><g fill="#f6eed6" stroke="#b7a476" stroke-width="2"><path d="M110 220L150 90Q200 20 250 90L290 220L250 220L228 125Q200 92 172 125L150 220Z"/><path d="M110 220L30 206L112 166Z"/><path d="M290 220L370 206L288 166Z"/><path d="M172 58Q200 6 228 58Z" fill="#2fb5c9"/><rect x="192" y="64" width="16" height="22" fill="#2fb5c9"/><rect x="60" y="212" width="280" height="8" fill="#d9ccaa"/></g></svg>`},{n:"🕌 حرم امام رضا (ع)",g:"#ff9a6b,#ffe3a3",s:`<svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMax meet"><g stroke="#8a6a1c" stroke-width="2"><rect x="50" y="150" width="300" height="70" fill="#f3e4bd"/><rect x="150" y="100" width="100" height="52" fill="#ead7a0"/><path d="M146 102Q200 20 254 102Z" fill="#f5c542"/><path d="M200 44V22" stroke-width="3"/><circle cx="200" cy="19" r="5" fill="#f5c542"/><rect x="92" y="62" width="14" height="90" fill="#2fb5c9"/><rect x="294" y="62" width="14" height="90" fill="#2fb5c9"/><ellipse cx="99" cy="58" rx="9" ry="12" fill="#f5c542"/><ellipse cx="301" cy="58" rx="9" ry="12" fill="#f5c542"/><path d="M60 150Q80 112 100 150Z M300 150Q320 112 340 150Z" fill="#2fb5c9"/><g fill="#5a3a12"><rect x="76" y="176" width="22" height="44" rx="11"/><rect x="132" y="176" width="22" height="44" rx="11"/><rect x="189" y="176" width="22" height="44" rx="11"/><rect x="246" y="176" width="22" height="44" rx="11"/><rect x="302" y="176" width="22" height="44" rx="11"/></g></g></svg>`},{n:"📡 برج میلاد",g:"#0b1440,#4a3a8a",night:1,s:`<svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMax meet"><g stroke="#556" stroke-width="2"><path d="M188 220L195 112H205L212 220Z" fill="#aab4c6"/><ellipse cx="200" cy="100" rx="30" ry="15" fill="#d5dded"/><rect x="190" y="82" width="20" height="16" fill="#bfc9dd"/><rect x="197" y="26" width="6" height="58" fill="#cfd6e4"/><circle cx="200" cy="22" r="5" fill="#ff3b3b" class="bl"/></g><g fill="#ffe27a"><circle cx="185" cy="100" r="2.5"/><circle cx="200" cy="104" r="2.5"/><circle cx="215" cy="100" r="2.5"/></g></svg>`}];
function setScene(){const c=SC[Math.floor((S.lvl-1)/10)%SC.length];$('#sc').style.background='linear-gradient(180deg,'+c.g+')';$('#sc').className=c.night?'night':'';$('#lm').innerHTML=c.s;$('#sn').textContent=c.n;$('.sun').textContent=c.night?'🌙':'😄';
 $('#st').innerHTML=Array.from({length:18},()=>'<i style="left:'+Math.random()*100+'%;top:'+Math.random()*45+'%;animation-delay:'+Math.random()*3+'s"></i>').join('')}
try{const w=window.Eitaa&&window.Eitaa.WebApp;if(w){w.ready();w.expand();if(w.disableVerticalSwipes)w.disableVerticalSwipes()}}catch(e){}
let cur,letters,path=[],pos=[],R=0;
const plate=$('#plate');
function coins(){$('#cn').textContent=fa(S.coins)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){plate.querySelectorAll('.l').forEach(e=>e.remove());R=Math.min(290,innerWidth-24,innerHeight*.38);plate.style.width=plate.style.height=R+'px';
 const n=letters.length,rad=R/2-42;pos=letters.map((c,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [R/2-6+rad*Math.cos(a),R/2-6+rad*Math.sin(a)]});
 letters.forEach((c,i)=>{const e=document.createElement('div');e.className='l';e.textContent=c;e.style.left=pos[i][0]+'px';e.style.top=pos[i][1]+'px';plate.appendChild(e)})}
function slots(){const s=$('#slots');s.innerHTML='';cur.w.forEach(w=>{const r=document.createElement('div');r.className='w';const f=S.found.includes(w),v=S.rev[w]||0;
 [...w].forEach((c,i)=>{const e=document.createElement('div');e.className='c'+(f||i<v?' on':'');e.textContent=f||i<v?c:'';r.appendChild(e)});s.appendChild(r)})}
function load(){if(S.lvl>LV.length){modal('<h2>🏆 تبریک!</h2>همه مرحله‌ها را تمام کردی!<br>مرحله‌های جدید به‌زودی...','باشه');return}
 cur=LV[S.lvl-1];setScene();letters=shuffle(cur.l.slice());$('#lv').textContent='مرحله '+fa(S.lvl)+' از '+fa(LV.length);coins();build();slots();$('#tag').classList.remove('on')}
function done(){S.coins+=5;const ch=S.lvl%10==0;if(ch)S.coins+=25;const lv=S.lvl;S.lvl++;S.found=[];S.rev={};save();coins();
 setTimeout(()=>modal(ch?'<h2>پایان فصل '+fa(lv/10)+'</h2><div class="st">⭐⭐⭐</div>جایزه فصل: +۲۵🪙 و +۵🪙':'<h2>پایان مرحله '+fa(lv)+'</h2><div class="st">🎉</div>تبریک! +۵🪙','ادامه',load),600)}
function got(w,bonus){if(!S.found.includes(w))S.found.push(w);if(bonus)S.coins+=5;save();coins();slots();if(cur.w.every(x=>S.found.includes(x)))done()}
function ptr(e){const r=plate.getBoundingClientRect();return [e.clientX-r.left-6,e.clientY-r.top-6]}
function upd(p){const ls=plate.querySelectorAll('.l');ls.forEach((e,i)=>e.classList.toggle('s',path.includes(i)));
 const pts=path.map(i=>pos[i].join(',')+' ').join('')+(p?p[0]+','+p[1]:'');$('#ln').setAttribute('points',pts);
 const t=$('#tag');t.className=path.length?'on':'';t.textContent=path.map(i=>letters[i]).join('')}
plate.onpointerdown=e=>{plate.setPointerCapture(e.pointerId);path=[];mv(e)};
function mv(e){if(e.buttons===0&&e.pointerType==='mouse')return;const p=ptr(e);
 for(let i=0;i<pos.length;i++){if(Math.hypot(p[0]-pos[i][0],p[1]-pos[i][1])<28){
  if(path[path.length-2]===i)path.pop();else if(!path.includes(i))path.push(i);break}}
 upd(p)}
plate.onpointermove=e=>{if(path.length||e.buttons)mv(e)};
plate.onpointerup=plate.onpointercancel=()=>{const w=path.map(i=>letters[i]).join('');const t=$('#tag');
 if(w.length>1){if(S.found.includes(w))toast('این کلمه را قبلاً پیدا کردی');
  else if(cur.w.includes(w)){got(w,1)}else{t.className='on bad'}}
 path=[];setTimeout(()=>{upd(null);$('#ln').setAttribute('points','')},w.length>1&&!cur.w.includes(w)?350:120)};
$('#shuf').onclick=()=>{shuffle(letters);build()};
$('#hint').onclick=()=>{if(S.coins<45)return toast('سکه کافی نیست 🪙');const u=cur.w.filter(w=>!S.found.includes(w));if(!u.length)return;
 const w=u[0];S.coins-=45;S.rev[w]=(S.rev[w]||0)+1;if(S.rev[w]>=w.length)got(w,0);else{save();coins();slots()}};
function daily(){if(S.d===TODAY)return;S.s=S.d===TODAY-1?S.s+1:1;S.d=TODAY;const b=10*Math.min(S.s,7);S.coins+=b;save();
 modal('<h2>🎁 هدیه روزانه</h2>روز '+fa(S.s)+' پشت‌سرهم<br><b>+'+fa(b)+' 🪙</b><br><small>فردا برگرد تا هدیه بزرگ‌تر بگیری!</small>','دریافت',()=>coins())}
load();daily();
</script></body></html>
